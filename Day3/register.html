<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <h1>Registration Form</h1>
      <form >
        <fieldset>
          <legend>Personal Details</legend>
          <label for="name-id">Enter Name</label>
          <input type="text" name="" id="name-id" required /><br /><br />
          <label for="email-id">Enter Email</label>
          <input type="email" name="" id="email-id" required /><br /><br />
          <label for="tel-id">Enter Phone No</label>
          <input type="tel" id="tel-id" required />
        </fieldset>
        <fieldset>
          <legend>Account</legend>
          <label for="username-id">Enter Username</label>
          <input
            type="text"
            name=""
            id="username-id"
            pattern="[A-Za-z0-9_]{3,20}"
            required
          /><br /><br />
          <label for="pass-id">Enter Password</label>
          <input type="password" name="" id="pass-id" required /><br /><br />
          <label for="confirm-pass-id">Confirm Password</label>
          <input type="password" name="" id="confirm-pass-id" required />
        </fieldset>
        <br />
        <label for="dob-id">Enter Date of Birth</label>
        <input type="date" name="" id="dob-id" required /><br /><br />
        <label for="age">Enter your Age</label>
        <input type="number" name="age" id="age" /><br /><br />
        <label for="graduation">Enter Graduatuion End Date</label>
        <input type="month" name="graduation" id="graduation" required /><br /><br />
        <label for="job-title-id">Select Job Title:</label>
        <input list="job-titles" id="job-title-id" name="job-title" required />

        <datalist id="job-titles">
          <option value="Business Analyst"></option>
          <option value="Data Analyst"></option>
          <option value="Full-Stack Web Developer"></option>
          <option value="Ai Engineer"></option>
          <option value="Plumber"></option>
          <option value="House Keeping"></option>
          <option value="HR Manager"></option>
          <option value="Finance Manager"></option></datalist
        ><br /><br />
        <fieldset>
          <legend>Preferences</legend>
          <fieldset>
            <legend>Notifications</legend>
            <input type="radio" name="notifs" id="all-notifs" />
            <label for="all-notifs">Receive all Notifications</label><br /><br />
            <input type="radio" name="notifs" id="imp-notifs" />
            <label for="imp-notifs">Receive only Important notification</label><br /><br />
            <input type="radio" name="notifs" id="notifs" />
            <label for="notifs">Receive no notification</label><br /><br />
          </fieldset>
          <br />
          <label for="profile-color">Pick a Color for profile</label>
          <input type="color" name="" id="profile-color" value="#e67665" /><br /><br />
          <label for="skill-level">Choose your Skill Level</label>
          <input type="range" name="" id="skill-level" min="0" max="10" value="7" />
        </fieldset>
        <br />

        <fieldset>
          <legend>Choose Your Language(s)</legend>
          <input type="checkbox" name="" id="javascript" />
          <label for="javascript">JavaScript</label><br /><br />
          <input type="checkbox" name="" id="python" />
          <label for="python">Python</label>
        </fieldset>
        <br />
        <label for="resume-id">Upload your Resume</label>
        <input type="file" name="resume-id" id="resume-id" required /><br /><br />
        <label for="url-id">Enter your Portfolio URL</label>
        <input type="url" name="url-id" id="url-id" /><br /><br />

        <label for="interview-time">Choose a date and time for your Interview :</label>
        <input
          type="datetime-local"
          name="interview-time"
          id="interview-time"
          required
        /><br /><br />
        <label for="week-id">Which week would you like to start? :</label>
        <input type="week" name="week" id="week-id" min="2026-W32" max="2026-W52" required />
      </form>
    </main>
  </body>
</html>
