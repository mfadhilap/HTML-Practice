<!DOCTYPE html>
<html lang="en-US">
    <head>
        <!-- Contains all the metadata related to the Web Page, Improves the search engine results and SEO-->
        <meta charset="utf-8">
        <!-- Charset is used to define character encoding used. UTF-8 includes most of the characters so its a very common encoding   -->
        <meta name="viewport" content="width=device-width">
        <!-- Improves sites responsiveness. Renders pages according to the devices width and does'nt just scale whole thing to a smaller form  -->
        <title>First Site</title> <!-- Its title thats displayed on the browser tab -->
    </head>
    <body>
        Hello World!
    </body>
</html>
