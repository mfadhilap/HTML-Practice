    <main>
      <form>
        <label for="name-id">Enter Name *</label>
        <input type="text" id="name-id" required /><br /><br />

        <label for="tel-id">Enter Phone No *</label>
        <input type="tel" id="tel-id" required />
        <br />
        <br />
        <label for="dept-title-id">Select Department: *</label>
        <select id="dept-title-id" name="dept-title" required>
          <option value="" disabled selected>Select department</option>
          <option value="Finance">Finance</option>
          <option value="technology">technology</option>
          <option value="Product">Product</option>
          <option value="Revenue">Revenue</option>
          <option value="People">People</option>
          <option value="Growth">Growth</option>
        </select>
        <br /><br />
        <label for="msg">Tell us:</label>
        <textarea id="msg" name="msg">Enter message</textarea> <br /><br />
        <input type="checkbox" id="newsletter" />
        <label for="newsletter">Subscribe our newsletter</label><br /><br />
        <input type="submit" /> <br /><br />
      </form>
