<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALLERY</title>
  </head>
  <body>
    <main>
      <h1>Gallery</h1>
      <figure>
        <img src="https://picsum.photos/id/36/1000/300" alt="Camera Parts " />
        <figcaption>Camera parts DisAssembled</figcaption>
      </figure>
      <!-- Used this photo as decorative image to give the user of the site to feel they entering a photo gallery section -->
      <figure>
        <img src="https://picsum.photos/id/250/1000/300" alt="Camera" />
        <figcaption>Photo of a Camera</figcaption>
      </figure>
      <!-- Used this photo as decorative image also to give the user of the site to feel they entering a photo gallery section as camera is closer to image aesthetic -->
      <section>
        <h2>From the lens of Van Gogh</h2>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=1"
            alt="Girl holding a DSLR "
          />
          <figcaption>A Girl Capturing moments through her lens</figcaption>
        </figure>

        <figure>
          <img
            src="https://picsum.photos/300/300?random=2"
            alt="Man on a bike "
          />
          <figcaption>A Man Enjoying the view from his bike</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=3"
            alt="Children Playing"
          />
          <figcaption>
            Children playing and enjoying with their friends
          </figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=4"
            alt="Woman drinking Tea"
          />
          <figcaption>A Woman sipping on her tea amidst the chaos</figcaption>
        </figure>
        <figure>
          <img src="https://picsum.photos/300/300?random=5" alt="Waterfall" />
          <figcaption>
            Beautifully Captured Image of a Waterfall between the dense Forest
          </figcaption>
        </figure>
      </section>
      <br />
      <section>
        <h2>From the lens of Leonardo Da Vinci</h2>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=1"
            alt="High heel Sandals "
          />
          <figcaption>
            A white high heel sandal placed for display at a mall
          </figcaption>
        </figure>

        <figure>
          <img
            src="https://picsum.photos/300/300?random=2"
            alt="Man sleeping "
          />
          <figcaption>A Man Relaxing after a heavy day of work</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=3"
            alt="Child Crying"
          />
          <figcaption>
            Child lost in the crowd crying out for his mom
          </figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=4"
            alt="Festival crowd"
          />
          <figcaption>A Huge crowd Gathered to celebrate</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=5"
            alt="Ferris Wheel"
          />
          <figcaption>Beautiful Ferris wheel at dawn</figcaption>
        </figure>
      </section>
      <br />
      <section>
        <h2>From the lens of Niko Koatlic</h2>
        <figure>
          <img src="https://picsum.photos/300/300?random=1" alt="Horse Shoe " />
          <figcaption>A Horse shoe worn by the most handsome horse</figcaption>
        </figure>

        <figure>
          <img
            src="https://picsum.photos/300/300?random=2"
            alt="woman crying "
          />
          <figcaption>Woman weeping after a heart break</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=3"
            alt="Child Crying"
          />
          <figcaption>Child crying out of hunger</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=4"
            alt="Newyork Citylights"
          />
          <figcaption>Beautiful image of New York City</figcaption>
        </figure>
        <figure>
          <img
            src="https://picsum.photos/300/300?random=5"
            alt="Kids in Pool"
          />
          <figcaption>
            Kids having the day of their life at the amusement park
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
